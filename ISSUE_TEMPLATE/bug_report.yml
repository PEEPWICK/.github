name: Bug report
description: Something that doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings › About
      placeholder: 0.2.1a
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution, desktop, Wayland or X11
      placeholder: Ubuntu 24.04, GNOME, Wayland
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - AppImage
        - .deb
        - From source
  - type: textarea
    id: report
    attributes:
      label: Error report
      description: "If the browser gave you an error report, paste it here. It holds no personal data."
      render: text
