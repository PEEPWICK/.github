name: Öneri · Feature request
description: Bir fikir ya da iyileştirme · An idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi sorunu çözüyor? · What problem does it solve?
      description: Önce sorunu anlatın, sonra çözümü. · Describe the problem first, then the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Önerdiğiniz çözüm · Your idea
    validations:
      required: true
